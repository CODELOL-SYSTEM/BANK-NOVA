<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaBank</title>
<style>
:root{--bg:#0f1220;--g:#262b55;--panel:#171b2e;--panel2:#1f2440;--txt:#eef0ff;--mut:#8b91b8;--acc:#6c5ce7;--acc2:#00cec9;--ok:#2ecc71;--ko:#ff6b6b;--r:18px;--line:#262c50;--bd:#2c3258;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:light){:root{--bg:#eef1f8;--g:#d9e1ff;--panel:#fff;--panel2:#f0f3fb;--txt:#0d1226;--mut:#5d6785;--line:#dde3f2;--bd:#d3daee}}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
body{background:radial-gradient(1200px 600px at 10% -10%,var(--g) 0,transparent 60%),var(--bg);color:var(--txt);min-height:100vh}
button{cursor:pointer;border:0;color:inherit;font-size:inherit}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--panel2);color:var(--txt);font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
label{font-size:12px;color:var(--mut);display:block;margin:12px 0 6px}
.btn{background:linear-gradient(135deg,var(--acc),#8e7dff);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;width:100%;margin-top:16px;transition:.15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);color:var(--txt);width:auto;margin:0;padding:10px 16px;font-size:14px}
.btn.sm{width:auto;margin:0;padding:9px 15px;font-size:13px}
.btn.danger{background:#3a1f2c;color:var(--ko)}
.hidden{display:none!important}
#auth{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.box{background:var(--panel);border-radius:var(--r);padding:30px;width:100%;max-width:420px;box-shadow:0 20px 60px #0007}
.logo{font-weight:800;font-size:24px}.logo span{color:var(--acc2)}
.tabs{display:flex;background:var(--panel2);border-radius:12px;padding:4px;margin:20px 0 6px}
.tabs button{flex:1;padding:10px;border-radius:9px;background:transparent;color:var(--mut);font-weight:600}
.tabs button.on{background:var(--acc);color:#fff}
.row{display:flex;gap:10px}.row>div{flex:1}
.err{color:var(--ko);font-size:13px;margin-top:10px;min-height:16px}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--panel);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0}
aside .logo{padding:0 10px 20px}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:transparent;color:var(--mut);font-weight:600;text-align:left;font-size:14px}
.nav:hover{background:var(--panel2);color:var(--txt)}.nav.on{background:var(--acc);color:#fff}
.spacer{flex:1}.content{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 30px}
.top h1{font-size:22px}
.who{display:flex;align-items:center;gap:14px;position:relative}
.bell{background:var(--panel);width:42px;height:42px;border-radius:12px;position:relative;font-size:18px}
.dot{position:absolute;top:-5px;right:-5px;background:var(--ko);color:#fff;font-size:11px;border-radius:10px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;font-weight:700}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
#np{position:absolute;top:56px;right:0;width:320px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 20px 50px #000a;z-index:5;font-size:13px}
.nt{padding:10px 0;border-bottom:1px solid var(--line)}.nt:last-child{border:0}.nt small{color:var(--mut);display:block;margin-top:2px}
#view{padding:0 30px 50px;max-width:1100px}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}
@media(max-width:900px){#app{flex-direction:column}
aside{width:100%;height:auto;position:fixed;bottom:0;left:0;top:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:8;overflow-x:auto;border-top:1px solid var(--line)}
aside .logo,.spacer,.nav .t{display:none}.nav{flex:1;justify-content:center;padding:12px 8px}
#view{padding:0 14px 90px}.top{padding:16px 14px}.grid{grid-template-columns:1fr}#np{width:280px}.who .btn{display:none}}
.panel{background:var(--panel);border-radius:var(--r);padding:24px}
h3{font-size:15px;color:var(--mut);font-weight:600;margin-bottom:14px}
.balance{font-size:44px;font-weight:800;margin:4px 0 2px}.iban{color:var(--mut);font-size:13px;word-break:break-all}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stat{display:flex;gap:12px;margin-top:18px}.stat div{flex:1;background:var(--panel2);border-radius:12px;padding:12px;font-size:12px;color:var(--mut)}.stat b{display:block;font-size:17px;color:var(--txt);margin-top:3px}
/* CARTE 3D */
.scene{perspective:900px;width:100%;max-width:380px;height:230px;margin:26px auto 14px}
.tilt{width:100%;height:100%;transform-style:preserve-3d;transition:transform .12s ease-out}
.flip{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;cursor:pointer}
.flip.back{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;padding:22px;overflow:hidden;transform-style:preserve-3d;box-shadow:0 35px 50px -10px #000c,inset 0 1px 1px #fff7,inset 0 -2px 6px #0005;color:#fff}
.front{background:linear-gradient(135deg,#4b3fd1,#6c5ce7 45%,#00cec9 120%)}
.front::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ff000010 0 6px,#00ff0010 6px 12px,#0000ff10 12px 18px);mix-blend-mode:overlay}
.gl{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,30%) var(--gy,15%),#fffa,transparent 50%);mix-blend-mode:overlay;pointer-events:none}
.frozen .front{filter:grayscale(1) brightness(.65)}
.bk{transform:rotateY(180deg);background:linear-gradient(135deg,#2d3436,#1b1f3a);padding:0}
.strip{height:42px;background:#000;margin-top:26px}
.sig{margin:20px 22px 0;display:flex;gap:8px}.sg{flex:1;height:36px;background:repeating-linear-gradient(45deg,#fff,#fff 6px,#e8e8e8 6px,#e8e8e8 12px);border-radius:4px;color:#222;font-style:italic;padding:8px;font-size:13px}
.cvv{background:#fff;color:#111;padding:8px 12px;border-radius:4px;font-weight:700;letter-spacing:2px}
.chip{width:46px;height:34px;border-radius:7px;background:linear-gradient(135deg,#f6d365,#c98b4a);margin-top:26px;transform:translateZ(20px);box-shadow:0 3px 6px #0005,inset 0 0 0 1px #0003}
.num{font-size:21px;letter-spacing:2.5px;margin-top:20px;font-weight:600;transform:translateZ(30px);text-shadow:0 1px 0 #fff6,0 -1px 1px #0008,0 6px 10px #0006}
.meta{display:flex;justify-content:space-between;margin-top:16px;font-size:11px;text-transform:uppercase;transform:translateZ(20px)}.meta b{display:block;font-size:14px;letter-spacing:1px}
.brand{position:absolute;right:22px;top:20px;font-weight:800;font-style:italic;font-size:20px;transform:translateZ(25px)}
.note{font-size:12px;color:var(--mut);text-align:center}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}.set small{color:var(--mut);display:block;margin-top:2px}
.sw{width:46px;height:26px;border-radius:13px;background:#343b6b;position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--acc2)}.sw.on::after{left:23px}
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ct{background:var(--panel2);border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;transition:.15s;border:1px solid transparent;position:relative;font-size:14px}
.ct:hover{border-color:var(--acc);transform:translateY(-2px)}
.av{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.ct small{color:var(--mut);display:block;font-size:11px;margin-top:2px}
.rm{position:absolute;top:6px;right:8px;background:none;color:var(--mut)}.rm:hover{color:var(--ko)}
.ct.add{border:2px dashed #343b6b;background:transparent;color:var(--mut);font-size:26px;display:flex;flex-direction:column;justify-content:center}.ct.add small{font-size:12px}
.tx{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px;cursor:pointer}
.tx small{color:var(--mut);display:block;margin-top:2px}.tx.new{animation:in .8s}
.plus{color:var(--ok);font-weight:700;white-space:nowrap}.minus{color:var(--ko);font-weight:700;white-space:nowrap}
.empty{color:var(--mut);font-size:14px;padding:10px 0}
.found{background:var(--panel2);border-radius:12px;padding:14px;margin-top:12px;display:flex;align-items:center;gap:12px}.found .av{margin:0}
.recap div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}.recap span:first-child{color:var(--mut)}
.okc{width:70px;height:70px;border-radius:50%;background:#1d4f33;color:var(--ok);font-size:34px;display:flex;align-items:center;justify-content:center;margin:6px auto 14px}
.faq{border-bottom:1px solid var(--line)}.faq button{width:100%;background:none;text-align:left;padding:16px 0;font-weight:600;font-size:15px}
.faq div{color:var(--mut);font-size:14px;line-height:1.55;padding:0 0 16px;display:none}.faq.open div{display:block}
#ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;animation:fade .2s}
.modal{background:var(--panel);border-radius:var(--r);padding:26px;width:100%;max-width:430px;animation:pop .25s;max-height:90vh;overflow:auto}
.modal h2{margin-bottom:8px}.modal p{color:var(--mut);font-size:14px}
.close{float:right;background:none;font-size:22px;color:var(--mut)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;background:var(--ok);color:#06210f;padding:12px 18px;border-radius:12px;font-weight:600;z-index:20;animation:pop .25s}.toast.ko{background:var(--ko);color:#2b0505}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--acc2);border-radius:50%;animation:sp 1s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes in{from{opacity:0;transform:translateY(-18px);background:#2ecc7133}}
.c3d{width:100%;height:300px;position:relative}.c3d.tall{height:390px}.c3d canvas{display:block;outline:none}
.hero{background:radial-gradient(520px 320px at 50% 40%,#3a3f8a66,var(--panel) 72%);overflow:hidden}
.panel,.ct{transition:transform .18s ease-out,box-shadow .25s;box-shadow:0 14px 34px -12px #000a,inset 0 1px 0 #ffffff14}
.btn{box-shadow:0 5px 0 #3b2fa8,0 12px 20px #0006}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3b2fa8}
.btn.ghost,.btn.danger{box-shadow:0 4px 0 #0004,0 10px 16px #0005}
.nav.gift,.nav.gift:hover{background:linear-gradient(135deg,#f6d365,#fda085);color:#3a2300;margin-bottom:10px;box-shadow:0 4px 0 #b9683c}
.pk{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}.pk button{padding:10px 16px;border-radius:12px;background:var(--panel2);font-weight:700;border:2px solid transparent;box-shadow:0 4px 0 #0004}.pk button.on{border-color:var(--acc2)}
.pk .sd{padding:0;width:36px;height:36px;border-radius:50%;box-shadow:0 5px 8px #0007,inset 0 2px 3px #fff7}.pk .sd.on{border-color:#fff;transform:scale(1.18)}
#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#auth,#app{position:relative;z-index:1}
#auth{flex-wrap:wrap;gap:34px}.ahero{width:min(460px,100%)}
.panel,.box,aside{background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4)}
.panel{border:1px solid #ffffff14}
.panel.hero{background:radial-gradient(520px 320px at 50% 40%,#3a3f8a66,color-mix(in srgb,var(--panel) 60%,transparent) 72%)}
.balance{background:linear-gradient(180deg,var(--txt),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #4b3fd1) drop-shadow(0 2px 0 #3b2fa8) drop-shadow(0 3px 0 #2c2282) drop-shadow(0 8px 10px #000a)}
.nav.on{box-shadow:0 5px 0 #3b2fa8,0 0 24px #6c5ce799}
.vi{animation:vin .6s cubic-bezier(.2,.9,.3,1)}
@keyframes vin{from{opacity:0;transform:perspective(1200px) rotateX(-12deg) translateY(36px) scale(.97)}}
@media(max-width:900px){#auth .box{order:-1}#c3a{height:240px}}
.cov{height:150px;border-radius:14px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:68px;box-shadow:inset 0 -40px 60px -30px #0008}
.its{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.it{background:var(--panel2);border-radius:14px;padding:10px;text-align:center;position:relative;font-size:14px}
.it .pi{height:92px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:46px;background:var(--bg);margin-bottom:8px}.it img{width:100%;height:100%;object-fit:cover}
.modal .found .cov{height:120px}
.logo{perspective:260px}.coin3{display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:-4px;animation:spin 2.6s linear infinite}
.coin3::before{content:"\20AC";display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff0a8,#c9962b);color:#8a5f10;font-weight:800;font-size:14px;box-shadow:inset 0 0 0 2px #8a5f10,0 0 12px #f6d36588}
@keyframes spin{to{transform:rotateY(360deg)}}
.panel,.ct,.it{position:relative}
.panel::after,.ct::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),#ffffff2a,transparent 55%);opacity:0;transition:opacity .2s;pointer-events:none}
.tt{box-shadow:0 40px 60px -20px #000c,inset 0 1px 0 #ffffff22!important}.tt::after{opacity:1}
.tx{animation:txin .6s cubic-bezier(.2,.9,.3,1) both}.tx:nth-child(2){animation-delay:.05s}.tx:nth-child(3){animation-delay:.1s}.tx:nth-child(4){animation-delay:.15s}.tx:nth-child(5){animation-delay:.2s}
@keyframes txin{from{opacity:0;transform:perspective(600px) rotateX(-40deg) translateY(20px)}}
.it .pi{transition:transform 1s}.it:hover .pi{transform:perspective(300px) rotateY(360deg)}
.car{perspective:1100px;height:370px;margin:10px 0 6px;touch-action:pan-y;user-select:none}
.ring{position:relative;width:240px;height:290px;margin:40px auto 0;transform-style:preserve-3d;transform:translateZ(-480px) rotateY(var(--ry,0deg));transition:transform .9s cubic-bezier(.2,.9,.3,1)}
.fc{position:absolute;inset:0;transform:rotateY(calc(var(--i)*30deg)) translateZ(480px);cursor:pointer}
.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.2,.5,1)}.fc.flip .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:0 30px 40px -15px #000b,inset 0 1px 0 #fff5}
.ff{background:linear-gradient(145deg,hsl(calc(var(--i)*30),70%,52%),hsl(calc(var(--i)*30 + 40),70%,30%));color:#fff;font-weight:700;font-size:18px}.ff b{font-size:54px;opacity:.35;line-height:1}
.fb{transform:rotateY(180deg);background:var(--panel2);font-size:15px;line-height:1.5;border:1px solid var(--line)}
textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--panel2);color:var(--txt);font:inherit;resize:none;outline:none}
label.up{display:block;border:2px dashed #4a5290;border-radius:14px;padding:22px;text-align:center;cursor:pointer;margin:0;color:var(--txt);font-size:14px}label.up:hover{border-color:var(--acc2)}
.upv{display:none;width:100%;max-height:150px;object-fit:cover;border-radius:12px;margin-top:10px}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--mut);padding:14px;border-top:1px solid var(--line)}.foot2{margin-top:16px;font-size:12px;color:var(--mut)}.foot2 span{cursor:default}
.cube{--s:64px;width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;animation:cr 9s linear infinite}
.cube i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.55);font-style:normal;background:var(--panel2) center/cover;border:1px solid #ffffff33;box-shadow:inset 0 0 18px #0006}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2))}.cube i:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(3){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
@keyframes cr{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.it .pi{perspective:500px}.it:hover .pi{transform:none}.pi.big{height:220px;perspective:700px;margin-bottom:10px}
.btn{background:var(--acc);box-shadow:0 2px 0 #0003}.btn:active{transform:translateY(1px);box-shadow:none}
.balance{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--txt);filter:none}
.nav.on{box-shadow:none}.logo span{color:var(--acc)}#bg3d{opacity:.4}
.top{background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
.hello{padding:4px 0 18px}.hello h2{font-size:24px}
.acc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--panel2);margin-bottom:10px;cursor:pointer;transition:.15s;border:1px solid transparent}.acc:hover{border-color:var(--acc)}.ai{font-size:26px}.ad{flex:1;min-width:0}.ab{font-weight:800;font-size:18px}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.bar{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:13px}.bar span{width:58px;color:var(--mut)}.bar div{flex:1;height:10px;border-radius:6px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.crow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}.crow:hover{background:#ffffff08}.ci{flex:1;min-width:0}

.pf{display:block;text-align:center;cursor:pointer;margin:0;font-size:13px;color:var(--mut)}.av.big{width:88px;height:88px;font-size:34px;margin-bottom:6px}
@media(prefers-color-scheme:light){:root{}}
:root[data-mode="dark"]{--bg:#0f1220;--g:#262b55;--panel:#171b2e;--panel2:#1f2440;--txt:#eef0ff;--mut:#8b91b8;--line:#262c50;--bd:#2c3258}
